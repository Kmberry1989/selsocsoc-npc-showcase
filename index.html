<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPC Showcase</title>
<meta name="theme-color" content="#1c1a24">
<meta name="description" content="Browse every Selfie Social Society NPC: faces, outfits, accessories — live from the shared asset manifest.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" class="brand-icon" width="36" height="36">
    <div>
      <h1>NPC Showcase</h1>
      <p class="manifest-status" id="manifestStatus">Loading…</p>
    </div>
  </div>
  <button id="refreshBtn" class="refresh-btn" aria-label="Refresh NPC data">⟳</button>
</header>

<main>
  <section id="stage" class="stage" aria-live="polite">
    <button id="prevBtn" class="nav-btn" aria-label="Previous NPC">‹</button>
    <article class="npc-card" id="npcCard">
      <h2 id="npcName">—</h2>
      <p class="npc-role" id="npcRole">—</p>
      <div class="art-row">
        <figure class="art">
          <button class="zoom-wrap" id="faceZoom" aria-label="Zoom face">
            <img id="faceImg" alt="NPC face" crossorigin="anonymous">
          </button>
          <figcaption>Face</figcaption>
        </figure>
        <figure class="art">
          <button class="zoom-wrap" id="outfitZoom" aria-label="Zoom outfit">
            <img id="outfitImg" alt="NPC outfit" crossorigin="anonymous">
          </button>
          <figcaption>Outfit</figcaption>
        </figure>
      </div>
      <p class="npc-notes" id="npcNotes"></p>
      <p class="npc-accessory" id="npcAccessory"></p>
      <button class="view3d-btn" id="view3dBtn" type="button">🔄 View in 3D</button>
      <button class="view3d-btn" id="cardBtn" type="button">⤓ Character card</button>
    </article>
    <button id="nextBtn" class="nav-btn" aria-label="Next NPC">›</button>
  </section>

  <nav class="thumb-strip" id="thumbStrip" aria-label="All NPCs"></nav>

  <p class="counter" id="counter"></p>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <img id="lightboxImg" alt="">
  <p id="lightboxCaption"></p>
</div>

<div class="viewer3d" id="viewer3d" hidden>
  <div class="viewer3d-frame">
    <button class="lightbox-close" id="viewer3dClose" aria-label="Close 3D view">✕</button>
    <div class="viewer3d-nav">
      <button class="viewer3d-nav-btn" id="viewer3dPrev" type="button" aria-label="Previous NPC">‹</button>
      <div class="viewer3d-title">
        <h2 id="viewer3dName">—</h2>
        <p class="viewer3d-counter" id="viewer3dCounter"></p>
      </div>
      <button class="viewer3d-nav-btn" id="viewer3dNext" type="button" aria-label="Next NPC">›</button>
    </div>
    <canvas id="viewer3dCanvas"></canvas>
    <p class="viewer3d-hint">Drag to spin</p>
    <div class="scale-panel" id="scalePanel">
      <div class="scale-chips" id="scaleChips"></div>
      <div class="scale-chips" id="modeChips">
        <button class="scale-chip active" type="button" data-mode="scale">Scale</button>
        <button class="scale-chip" type="button" data-mode="move">Move</button>
        <button class="scale-chip" type="button" data-mode="rotate">Rotate</button>
      </div>
      <div class="scale-chips" id="axisChips" hidden>
        <button class="scale-chip" type="button" data-axis="0">X</button>
        <button class="scale-chip active" type="button" data-axis="1">Y</button>
        <button class="scale-chip" type="button" data-axis="2">Z</button>
      </div>
      <div class="scale-row">
        <button class="scale-step" id="scaleDown" type="button" aria-label="Smaller">−</button>
        <input type="range" id="scaleSlider" min="0.25" max="2" step="0.05" value="1" aria-label="Accessory scale">
        <button class="scale-step" id="scaleUp" type="button" aria-label="Bigger">+</button>
        <span class="scale-value" id="scaleValue">1.00×</span>
      </div>
      <div class="scale-actions">
        <button class="scale-btn" id="scaleReset" type="button">Reset</button>
        <button class="scale-btn primary" id="copyScalesBtn" type="button">Copy scales</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { showNPC, stopViewer, getCurrentAccessories, setAccessoryScale, setAccessoryOffset, setAccessoryRotation, resetAccessoryTransform, getTransformOverrides, getScaleOverrides } from './viewer3d.js';
window.__npcViewer3D = { showNPC, stopViewer, getCurrentAccessories, setAccessoryScale, setAccessoryOffset, setAccessoryRotation, resetAccessoryTransform, getTransformOverrides, getScaleOverrides };
</script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
